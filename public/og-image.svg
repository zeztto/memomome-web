<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- 배경 그리드 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 타이틀 -->
  <text x="600" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="80" font-weight="bold" fill="#3b82f6" text-anchor="middle">메모모미</text>
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" fill="#94a3b8" text-anchor="middle">MeMoMoMe</text>

  <!-- 설명 -->
  <text x="600" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" fill="#cbd5e1" text-anchor="middle">프라이버시 중심의 웹 메모장</text>

  <!-- 아이콘 -->
  <rect x="520" y="420" width="160" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <line x1="540" y1="450" x2="660" y2="450" stroke="#64748b" stroke-width="2"/>
  <line x1="540" y1="480" x2="640" y2="480" stroke="#64748b" stroke-width="2"/>
  <line x1="540" y1="510" x2="620" y2="510" stroke="#64748b" stroke-width="2"/>
</svg>
